[build-system]
requires = [
  "pdm-backend==2.4.9",
  'meson[ninja]==1.12.0; implementation_name == "cpython"',
]

# pdm_build.py compiles the c++ extension when possible
build-backend = "pdm.backend"

[project]
name = "bencode2"
version = "0.3.34"
description = "A fast and correct bencode serialize/deserialize library"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "trim21", email = "trim21me@gmail.com" },
]
readme = 'readme.md'
keywords = [
  "bencode",
  "bittorrent",
  "bit-torrent",
  "serialize",
  "deserialize",
  'p2p',
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  'typing_extensions>=4.8.0',
]

[project.urls]
Homepage = "https://github.com/trim21/bencode-py"
Repository = "https://github.com/trim21/bencode-py"
Issues = "https://github.com/trim21/bencode-py/issues"

[dependency-groups]
dev = [
  'pdm-backend==2.4.9',
  'meson[ninja]==1.12.0; implementation_name == "cpython"',
  'mypy==2.3.1; implementation_name == "cpython"',
  'pytest==9.1.1',
  'pytest-codspeed==5.0.3; implementation_name == "cpython"',
  'pytest-cov==7.1.0',
  'pytest-github-actions-annotate-failures==0.4.2',
]

[tool.pdm.build]
custom-hook = 'pdm_build.py'
# pdm-backend collects everything under src/bencode2, but the c++ sources are
# only needed to build the extension
excludes = [
  'src/bencode2/*.cpp',
  'src/bencode2/*.hpp',
]

[tool.pytest.ini_options]
norecursedirs = ['vendor', '.venv', 'build', 'subprojects']

[tool.cibuildwheel]
skip = '*musl*'
environment = { 'UV_LINK_MODE' = 'copy' }

manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
# before-all = "uv tool install sccache"
# environment-pass = ['SCCACHE_GHA_ENABLED', 'ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN']
# environment = { "PATH" = "$PATH:/root/.local/bin" }

[tool.black]
extend-exclude = 'vendor'
target-version = ['py310']
line-length = 88

[tool.ruff]
target-version = 'py310'
line-length = 88
extend-exclude = ['vendor']

src = ['src', 'tests']

[tool.ruff.lint]
extend-select = ['UP', 'I', 'E', "W", 'FA', 'ANN']
ignore = ['ANN401', 'E721', 'E501']

[tool.ruff.lint.per-file-ignores]
"tests/**" = ['ANN']
"setup.py" = ['ANN']

[tool.coverage.run]
source = [
  "src",
]

[tool.mypy]
exclude = ['tests', 'vendor']
python_version = "3.10"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
show_error_codes = true
