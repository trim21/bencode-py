package:
  name: bencode2
  version: ${{ load_from_file("../pyproject.toml").project.version }}

source:
  path: '..'
  use_gitignore: true

build:
  number: 0
  skip: (python_allow_limited_api == 'true') and (win or (python != '3.12'))
  python:
    skip_pyc_compilation:
      - '*.py'
    version_independent: ${{ python_allow_limited_api == 'true' }}
  script:
    - if: win
      then: |
        :: conda-forge clang/compiler-rt sets clang-only -Wl flags in LDFLAGS
        :: which break meson's sanity check with MSVC cl.exe (D8021)
        set "LDFLAGS="
        ${{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv . --config-settings=setup-args=-Dpython.allow_limited_api=${{ python_allow_limited_api }}
        if errorlevel 1 exit /b 1
      else: >-
        ${{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
        --config-settings=setup-args=-Dpython.allow_limited_api=${{ python_allow_limited_api }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: target_platform != "win-arm64"
      then:
        - c-compiler >=1.9.0
        - cxx-compiler >=1.9.0
  host:
    - python
    - if: python_allow_limited_api == 'true'
      then:
        - python-abi3 3.12.*
    - pip
    - meson
    - ninja
    - meson-python
  run:
    - if: python_allow_limited_api == 'true'
      then:
        - python >=${{ python }}
      else:
        - python
    - typing_extensions>=4.8.0

  ignore_run_exports:
    from_package:
      - if: python_allow_limited_api == 'true'
        then:
          - python

tests:
  - if: python_allow_limited_api == 'false'
    then:
      python:
        imports:
          - bencode2
        python_version:
          - ${{ python }}.*

  - script:
      - pytest tests --assert-pkg-compiled=true

    requirements:
      run:
        - pytest
        - python

    files:
      source:
        - tests/
