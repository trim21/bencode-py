package:
  name: bencode2
  version: ${{ load_from_file("../pyproject.toml").project.version }}

source:
  path: '..'
  use_gitignore: true

build:
  number: 0
  skip: (python_allow_limited_api == 'true') and (win or (python != '3.12'))
  python:
    skip_pyc_compilation:
      - '*.py'
    version_independent: ${{ python_allow_limited_api == 'true' }}
  script:
    - if: win
      then: |
        where cl
        cl 2>&1 | findstr /i "Version"
        echo VSINSTALLDIR=%VSINSTALLDIR%
        echo NEWER_VS_WITH_OLDER_VC=%NEWER_VS_WITH_OLDER_VC%
        echo LATEST_VS=%LATEST_VS%
        echo INCLUDE=%INCLUDE%
        echo LIB=%LIB%
        if exist "%VSINSTALLDIR%\VC\Tools\MSVC" dir "%VSINSTALLDIR%\VC\Tools\MSVC"
        echo int main(){return 0;} > %TEMP%\meson_probe.cpp
        cl /nologo /utf-8 /c %TEMP%\meson_probe.cpp /Fo%TEMP%\meson_probe.obj
        echo CL_COMPILE_EXIT=%ERRORLEVEL%
        ${{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv . --config-settings=setup-args=-Dpython.allow_limited_api=${{ python_allow_limited_api }}
        if errorlevel 1 (
          for /d %%d in ("%SRC_DIR%\.mesonpy-*") do type "%%d\meson-logs\meson-log.txt" 2>nul
          exit /b 1
        )
      else: >-
        ${{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
        --config-settings=setup-args=-Dpython.allow_limited_api=${{ python_allow_limited_api }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: target_platform != "win-arm64"
      then:
        - c-compiler >=1.9.0
        - cxx-compiler >=1.9.0
        - compilers
  host:
    - python
    - if: python_allow_limited_api == 'true'
      then:
        - python-abi3 3.12.*
    - pip
    - meson
    - ninja
    - meson-python
  run:
    - if: python_allow_limited_api == 'true'
      then:
        - python >=${{ python }}
      else:
        - python
    - typing_extensions>=4.8.0

  ignore_run_exports:
    from_package:
      - if: python_allow_limited_api == 'true'
        then:
          - python

tests:
  - if: python_allow_limited_api == 'false'
    then:
      python:
        imports:
          - bencode2
        python_version:
          - ${{ python }}.*

  - script:
      - pytest tests --assert-pkg-compiled=true

    requirements:
      run:
        - pytest
        - python

    files:
      source:
        - tests/
